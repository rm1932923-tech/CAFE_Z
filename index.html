<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>کافه من | منوی دیجیتال</title>

<style>
:root{
  --bg:#f7f3ed;
  --card:#fff;
  --text:#29231f;
  --muted:#82766d;
  --accent:#7b4b2a;
  --accent2:#a96f43;
  --border:#eadfd5;
  --shadow:0 10px 30px #4b2d1812
}

*{
  box-sizing:border-box
}

body{
  margin:0;
  background:var(--bg);
  color:var(--text);
  font-family:Tahoma,Arial,sans-serif
}

header{
  background:linear-gradient(135deg,#3d2416,#7b4b2a);
  color:#fff;
  padding:28px 18px 22px;
  position:sticky;
  top:0;
  z-index:5;
  box-shadow:0 5px 20px #0002
}

.top{
  max-width:1100px;
  margin:auto;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:12px
}

.brand{
  font-size:25px;
  font-weight:800
}

.sub{
  font-size:12px;
  opacity:.8;
  margin-top:5px
}

button{
  font:inherit;
  border:0;
  cursor:pointer
}

.scan{
  background:#fff;
  color:#5b351e;
  padding:11px 15px;
  border-radius:12px;
  font-weight:bold
}

.container{
  max-width:1100px;
  margin:auto;
  padding:20px
}

.hero{
  background:#fff;
  border:1px solid var(--border);
  border-radius:22px;
  padding:22px;
  box-shadow:var(--shadow);
  margin-bottom:18px
}

.hero h1{
  margin:0 0 8px;
  font-size:24px
}

.hero p{
  margin:0;
  color:var(--muted);
  line-height:1.8
}

.search{
  width:100%;
  padding:14px 16px;
  border:1px solid var(--border);
  border-radius:14px;
  background:#fff;
  font-size:15px;
  margin-top:17px;
  outline:none
}

.categories{
  display:flex;
  gap:9px;
  overflow:auto;
  padding:4px 0 14px;
  scrollbar-width:none
}

.categories::-webkit-scrollbar{
  display:none
}

.cat{
  white-space:nowrap;
  background:#fff;
  border:1px solid var(--border);
  color:var(--text);
  padding:10px 15px;
  border-radius:999px
}

.cat.active{
  background:var(--accent);
  color:#fff;
  border-color:var(--accent)
}

.grid{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(230px,1fr));
  gap:15px
}

.item{
  background:var(--card);
  border:1px solid var(--border);
  border-radius:18px;
  overflow:hidden;
  box-shadow:var(--shadow);
  display:flex;
  flex-direction:column
}

.photo{
  height:145px;
  background:#ead8c6;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:55px
}

.info{
  padding:15px
}

.name{
  font-weight:800;
  font-size:17px
}

.desc{
  font-size:12px;
  color:var(--muted);
  line-height:1.7;
  margin:7px 0 12px;
  min-height:38px
}

.bottom{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:8px
}

.price{
  font-weight:800;
  color:var(--accent)
}

.add{
  background:var(--accent);
  color:#fff;
  border-radius:10px;
  padding:9px 13px
}

.empty{
  padding:35px;
  text-align:center;
  color:var(--muted)
}

.cart{
  position:fixed;
  left:18px;
  bottom:18px;
  background:#3d2416;
  color:#fff;
  border-radius:16px;
  padding:13px 16px;
  box-shadow:0 10px 30px #0003;
  display:none;
  z-index:10
}

.cart.show{
  display:block
}

.cart strong{
  margin-right:7px
}

.modal{
  display:none;
  position:fixed;
  inset:0;
  background:#0008;
  z-index:20;
  align-items:center;
  justify-content:center;
  padding:20px
}

.modal.show{
  display:flex
}

.modalbox{
  background:#fff;
  border-radius:22px;
  width:min(440px,100%);
  padding:20px;
  text-align:center
}

.modalbox h2{
  margin-top:0
}

#reader{
  width:100%;
  min-height:240px;
  border-radius:14px;
  overflow:hidden;
  background:#111
}

.close{
  background:#eee;
  color:#333;
  padding:10px 18px;
  border-radius:10px;
  margin-top:12px
}

.order{
  max-width:1100px;
  margin:28px auto 80px;
  padding:0 20px
}

.orderbox{
  background:#fff;
  border:1px solid var(--border);
  border-radius:20px;
  padding:18px
}

.orderbox h2{
  margin-top:0
}

.order-row{
  display:flex;
  justify-content:space-between;
  padding:10px 0;
  border-bottom:1px solid var(--border)
}

.checkout{
  width:100%;
  padding:13px;
  background:var(--accent);
  color:#fff;
  border-radius:12px;
  margin-top:15px;
  font-weight:bold
}

@media(max-width:600px){

  .top{
    align-items:flex-start
  }

  .brand{
    font-size:20px
  }

  .scan{
    font-size:12px
  }

  .container{
    padding:14px
  }

  .grid{
    grid-template-columns:1fr 1fr
  }

  .photo{
    height:120px
  }

  .desc{
    min-height:auto
  }

  .info{
    padding:12px
  }

  .name{
    font-size:15px
  }

  .add{
    padding:8px 10px;
    font-size:12px
  }
}
</style>
</head>

<body>

<header>

  <div class="top">

    <div>

      <div class="brand">
        ☕ کافه من
      </div>

      <div class="sub" id="tableLabel">
        منوی دیجیتال کافه
      </div>

    </div>

    <button
      class="scan"
      onclick="openScanner()"
    >
      📷 اسکن QR
    </button>

  </div>

</header>


<main class="container">

  <section class="hero">

    <h1>
      به کافه ما خوش آمدید
    </h1>

    <p>
      دسته‌بندی موردنظر را انتخاب کنید و محصولات را به سفارش خود اضافه کنید.
    </p>

    <input
      id="search"
      class="search"
      placeholder="🔎 جستجوی نوشیدنی، غذا، دسر..."
      oninput="render()"
    >

  </section>


  <nav
    class="categories"
    id="categories"
  ></nav>


  <section
    class="grid"
    id="menu"
  ></section>

</main>


<section class="order">

  <div class="orderbox">

    <h2>
      🛒 سفارش شما
    </h2>

    <div id="cartItems">

      <div class="empty">
        هنوز محصولی انتخاب نشده است.
      </div>

    </div>

    <div id="total"></div>

    <button
      class="checkout"
      onclick="submitOrder()"
    >
      ثبت سفارش
    </button>

  </div>

</section>


<button
  id="cartButton"
  class="cart"
  onclick="document.querySelector('.order').scrollIntoView({behavior:'smooth'})"
>
  🛒 سبد سفارش
  <strong id="cartCount">0</strong>
</button>


<div
  class="modal"
  id="scannerModal"
>

  <div class="modalbox">

    <h2>
      اسکن QR / بارکد
    </h2>

    <p>
      دوربین را مقابل QR کافه یا QR میز قرار دهید.
    </p>

    <div id="reader"></div>

    <button
      class="close"
      onclick="closeScanner()"
    >
      بستن
    </button>

  </div>

</div>


<script
  src="https://unpkg.com/html5-qrcode"
  type="text/javascript">
</script>


<script>

const menu = [

  },

  {

  },

  {

  },

  {
    id:26,
    cat:"شیک",
    name:"شیک وانیل",
    desc:"شیک وانیلی لطیف و خوش‌عطر",
    price:298000,
    icon:"🥛"
  }

];


let activeCat="همه";
let cart=[];


function money(n){

  return n.toLocaleString("fa-IR")+" تومان";

}


function cats(){

  const list=[
    "همه",
    ...new Set(
      menu.map(x=>x.cat)
    )
  ];


  document
    .getElementById("categories")
    .innerHTML=

    list.map(c=>`

      <button
        class="cat ${c===activeCat?'active':''}"
        onclick="activeCat='${c}';render()"
      >
        ${c}
      </button>

    `).join("");

}


function render(){

  cats();


  const q=
    document
      .getElementById("search")
      .value
      .trim()
      .toLowerCase();


  const data=
    menu.filter(x=>

      (
        activeCat==="همه"
        ||
        x.cat===activeCat
      )

      &&

      (
        !q
        ||
        (
          x.name+
          " "+
          x.desc+
          " "+
          x.cat
        )
        .toLowerCase()
        .includes(q)
      )

    );


  document
    .getElementById("menu")
    .innerHTML=

    data.length

    ?

    data.map(x=>`

      <article class="item">

        <div class="photo">
          ${x.icon}
        </div>

        <div class="info">

          <div class="name">
            ${x.name}
          </div>

          <div class="desc">
            ${x.desc}
          </div>

          <div class="bottom">

            <span class="price">
              ${money(x.price)}
            </span>

            <button
              class="add"
              onclick="add(${x.id})"
            >
              افزودن
            </button>

          </div>

        </div>

      </article>

    `).join("")

    :

    `
      <div class="empty">
        محصولی پیدا نشد.
      </div>
    `;


  updateCart();

}


function add(id){

  const x=
    cart.find(a=>a.id===id);


  x
    ?
    x.qty++

    :

    cart.push({
      id,
      qty:1
    });


  updateCart();

}


function remove(id){

  const x=
    cart.find(a=>a.id===id);


  if(!x)return;


  x.qty--;


  if(x.qty<=0){

    cart=
      cart.filter(
        a=>a.id!==id
      );

  }


  updateCart();

}


function updateCart(){

  const box=
    document.getElementById(
      "cartItems"
    );


  if(!cart.length){

    box.innerHTML=
      `
        <div class="empty">
          هنوز محصولی انتخاب نشده است.
        </div>
      `;


    document
      .getElementById("cartButton")
      .classList
      .remove("show");


    document
      .getElementById("total")
      .innerHTML="";


    return;

  }


  let total=0;
  let count=0;


  box.innerHTML=

    cart.map(c=>{

      const x=
        menu.find(
          a=>a.id===c.id
        );


      total+=
        x.price*c.qty;


      count+=
        c.qty;


      return `

        <div class="order-row">

          <span>
            ${x.name} × ${c.qty}
          </span>

          <span>

            ${money(
              x.price*c.qty
            )}

            <button
              onclick="remove(${x.id})"
            >
              −
            </button>

          </span>

        </div>

      `;

    }).join("");


  document
    .getElementById("total")
    .innerHTML=

    `
      <div
        style="padding-top:14px;font-weight:bold"
      >
        مبلغ کل: ${money(total)}
      </div>
    `;


  document
    .getElementById("cartCount")
    .textContent=count;


  document
    .getElementById("cartButton")
    .classList
    .add("show");

}


function submitOrder(){

  if(!cart.length){

    return alert(
      "لطفاً ابتدا یک محصول انتخاب کنید."
    );

  }


  const table=
    new URLSearchParams(
      location.search
    ).get("table")
    ||
    "نامشخص";


  alert(
    "سفارش شما ثبت شد.\n"+
    "میز: "+
    table+
    "\n\n"+
    "در نسخه واقعی می‌توان این بخش را به سرور و سیستم صندوق متصل کرد."
  );

}


let scanner;


async function openScanner(){

  document
    .getElementById(
      "scannerModal"
    )
    .classList
    .add("show");


  if(scanner)return;


  scanner=
    new Html5Qrcode(
      "reader"
    );


  try{

    await scanner.start(

      {
        facingMode:"environment"
      },

      {
        fps:10,

        qrbox:{
          width:230,
          height:230
        }

      },

      text=>{

        closeScanner();


        try{

          const u=
            new URL(text);


          if(
            u.origin===
            location.origin
          ){

            location.href=
              u.href;

          }else{

            location.href=
              text;

          }

        }catch(e){

          alert(
            "کد اسکن شد: "+
            text
          );

        }

      },

      ()=>{}

    );

  }catch(e){

    document
      .getElementById("reader")
      .innerHTML=

      `
        <p
          style="
            color:white;
            padding:30px
          "
        >
          دسترسی دوربین ممکن نیست.
          در مرورگر اجازه Camera را فعال کنید
          یا لینک QR را مستقیماً باز کنید.
        </p>
      `;

  }

}


async function closeScanner(){

  document
    .getElementById(
      "scannerModal"
    )
    .classList
    .remove("show");


  if(scanner){

    try{

      await scanner.stop();

    }catch(e){}


    try{

      scanner.clear();

    }catch(e){}


    scanner=null;


    document
      .getElementById("reader")
      .innerHTML="";

  }

}


const table=
  new URLSearchParams(
    location.search
  ).get("table");


if(table){

  document
    .getElementById(
      "tableLabel"
    )
    .textContent=
      "منوی دیجیتال • میز "+
      table;

}


render();

</script>
