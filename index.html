<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>کافه من | منوی دیجیتال</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    background: #f7f3ed;
    color: #29231f;
    font-family: Tahoma, Arial, sans-serif;
}

header {
    background: linear-gradient(135deg, #3d2416, #7b4b2a);
    color: white;
    padding: 25px 18px;
    position: sticky;
    top: 0;
    z-index: 10;
    box-shadow: 0 5px 20px rgba(0,0,0,.2);
}

.header-content {
    max-width: 1100px;
    margin: auto;
    display: flex;
    align-items: center;
    justify-content: space-between;
}

.logo {
    font-size: 25px;
    font-weight: bold;
}

.subtitle {
    font-size: 12px;
    opacity: .8;
    margin-top: 5px;
}

.scan-button {
    border: none;
    background: white;
    color: #5b351e;
    padding: 11px 15px;
    border-radius: 12px;
    cursor: pointer;
    font-weight: bold;
}

.container {
    max-width: 1100px;
    margin: auto;
    padding: 20px;
}

.welcome {
    background: white;
    border: 1px solid #eadfd5;
    border-radius: 22px;
    padding: 22px;
    margin-bottom: 18px;
    box-shadow: 0 10px 30px rgba(75,45,24,.07);
}

.welcome h1 {
    margin-top: 0;
}

.welcome p {
    color: #82766d;
    line-height: 1.8;
}

.search {
    width: 100%;
    padding: 14px;
    border: 1px solid #eadfd5;
    border-radius: 14px;
    font-size: 15px;
    outline: none;
}

.categories {
    display: flex;
    gap: 9px;
    overflow-x: auto;
    padding: 5px 0 18px;
}

.category {
    white-space: nowrap;
    background: white;
    border: 1px solid #eadfd5;
    padding: 10px 16px;
    border-radius: 50px;
    cursor: pointer;
}

.category.active {
    background: #7b4b2a;
    color: white;
}

.menu {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(230px, 1fr));
    gap: 15px;
}

.product {
    background: white;
    border: 1px solid #eadfd5;
    border-radius: 18px;
    overflow: hidden;
    box-shadow: 0 10px 30px rgba(75,45,24,.07);
}

.product-image {
    height: 145px;
    background: #ead8c6;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 55px;
}

.product-info {
    padding: 15px;
}

.product-name {
    font-size: 17px;
    font-weight: bold;
}

.product-description {
    color: #82766d;
    font-size: 12px;
    line-height: 1.7;
    margin: 8px 0 12px;
}

.product-bottom {
    display: flex;
    align-items: center;
    justify-content: space-between;
}

.price {
    color: #7b4b2a;
    font-weight: bold;
}

.add-button {
    background: #7b4b2a;
    color: white;
    border: none;
    border-radius: 10px;
    padding: 9px 13px;
    cursor: pointer;
}

.order {
    max-width: 1100px;
    margin: 30px auto 80px;
    padding: 0 20px;
}

.order-box {
    background: white;
    border: 1px solid #eadfd5;
    border-radius: 20px;
    padding: 20px;
}

.order-row {
    display: flex;
    justify-content: space-between;
    padding: 12px 0;
    border-bottom: 1px solid #eadfd5;
}

.remove-button {
    border: none;
    background: #eee;
    border-radius: 8px;
    padding: 4px 9px;
    cursor: pointer;
}

.checkout {
    width: 100%;
    padding: 14px;
    background: #7b4b2a;
    color: white;
    border: none;
    border-radius: 12px;
    margin-top: 15px;
    cursor: pointer;
    font-weight: bold;
}

.empty {
    text-align: center;
    color: #82766d;
    padding: 30px;
}

.cart-button {
    position: fixed;
    left: 18px;
    bottom: 18px;
    background: #3d2416;
    color: white;
    border: none;
    border-radius: 16px;
    padding: 14px 18px;
    display: none;
    cursor: pointer;
    z-index: 20;
    box-shadow: 0 10px 30px rgba(0,0,0,.25);
}

.cart-button.show {
    display: block;
}

/* پنجره اسکن */
.modal {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,.8);
    z-index: 100;
    align-items: center;
    justify-content: center;
    padding: 20px;
}

.modal.show {
    display: flex;
}

.modal-box {
    background: white;
    width: min(450px,100%);
    border-radius: 22px;
    padding: 20px;
    text-align: center;
}

#reader {
    width: 100%;
    overflow: hidden;
    border-radius: 15px;
    background: #111;
}

.close-button {
    margin-top: 15px;
    padding: 10px 20px;
    border: none;
    border-radius: 10px;
    cursor: pointer;
}

/* موبایل */
@media(max-width:600px) {

    .header-content {
        align-items: flex-start;
    }

    .logo {
        font-size: 20px;
    }

    .scan-button {
        font-size: 12px;
    }

    .container {
        padding: 14px;
    }

    .menu {
        grid-template-columns: 1fr 1fr;
        gap: 10px;
    }

    .product-image {
        height: 120px;
    }

    .product-info {
        padding: 12px;
    }

    .product-name {
        font-size: 15px;
    }

    .add-button {
        font-size: 12px;
        padding: 8px 10px;
    }
}
</style>
</head>

<body>

<header>

<div class="header-content">

<div>
<div class="logo">
☕ کافه من
</div>

<div class="subtitle" id="tableLabel">
منوی دیجیتال کافه
</div>

</div>

<button class="scan-button" onclick="openScanner()">
📷 اسکن QR
</button>

</div>

</header>


<main class="container">

<section class="welcome">

<h1>
به کافه ما خوش آمدید
</h1>

<p>
دسته‌بندی موردنظر را انتخاب کنید و محصول مورد علاقه خود را به سفارش اضافه کنید.
</p>

<input
id="search"
class="search"
placeholder="🔎 جستجوی قهوه، غذا، دسر..."
oninput="renderMenu()"
>

</section>


<nav class="categories" id="categories"></nav>


<section class="menu" id="menu"></section>

</main>


<section class="order">

<div class="order-box">

<h2>
🛒 سفارش شما
</h2>

<div id="cartItems">

<div class="empty">
هنوز محصولی انتخاب نشده است.
</div>

</div>

<div id="total"></div>

<button class="checkout" onclick="submitOrder()">
ثبت سفارش
</button>

</div>

</section>


<button
id="cartButton"
class="cart-button"
onclick="scrollToOrder()"
>
🛒 سبد سفارش
<span id="cartCount">0</span>
</button>


<!-- پنجره اسکن QR -->

<div class="modal" id="scannerModal">

<div class="modal-box">

<h2>
اسکن QR
</h2>

<p>
دوربین را مقابل QR Code قرار دهید.
</p>

<div id="reader"></div>

<button
class="close-button"
onclick="closeScanner()"
>
بستن
</button>

</div>

</div>


<!-- کتابخانه QR Scanner -->

<script src="https://unpkg.com/html5-qrcode"></script>


<script>

/* =========================
   محصولات کافه
========================= */

const products = [

{
id: 1,
category: "قهوه گرم",
name: "اسپرسو",
description: "اسپرسوی تازه با دانه‌های منتخب",
price: 70000,
icon: "☕"
},

{
id: 2,
category: "قهوه گرم",
name: "آمریکانو",
description: "اسپرسو همراه آب داغ",
price: 90000,
icon: "☕"
},

{
id: 3,
category: "قهوه گرم",
name: "کاپوچینو",
description: "اسپرسو، شیر بخار داده شده و فوم شیر",
price: 120000,
icon: "☕"
},

{
id: 4,
category: "قهوه گرم",
name: "لاته",
description: "اسپرسو با شیر گرم و فوم لطیف",
price: 125000,
icon: "🥛"
},

{
id: 5,
category: "قهوه سرد",
name: "آیس لاته",
description: "لاته خنک با یخ",
price: 135000,
icon: "🧊"
},

{
id: 6,
category: "قهوه سرد",
name: "آیس آمریکانو",
description: "اسپرسو، آب سرد و یخ",
price: 110000,
icon: "🧊"
},

{
id: 7,
category: "نوشیدنی",
name: "لیموناد",
description: "لیموی تازه و نعناع",
price: 100000,
icon: "🍋"
},

{
id: 8,
category: "نوشیدنی",
name: "موهیتو",
description: "نعناع، لیمو و نوشیدنی گازدار",
price: 130000,
icon: "🍹"
},

{
id: 9,
category: "چای و دمنوش",
name: "چای سیاه",
description: "چای ایرانی خوش عطر",
price: 60000,
icon: "🍵"
},

{
id: 10,
category: "چای و دمنوش",
name: "دمنوش آرامش",
description: "ترکیب گیاهی معطر",
price: 85000,
icon: "🌿"
},

{
id: 11,
category: "کیک و دسر",
name: "چیزکیک",
description: "چیزکیک روز با سس مخصوص",
price: 150000,
icon: "🍰"
},

{
id: 12,
category: "کیک و دسر",
name: "براونی شکلاتی",
description: "براونی شکلاتی با گردو",
price: 130000,
icon: "🍫"
},

{
id: 13,
category: "صبحانه",
name: "صبحانه کلاسیک",
description: "تخم مرغ، پنیر، نان تازه و سبزیجات",
price: 220000,
icon: "🍳"
},

{
id: 14,
category: "غذا",
name: "ساندویچ مرغ",
description: "مرغ گریل، سبزیجات و سس مخصوص",
price: 210000,
icon: "🥪"
}

];


/* =========================
   وضعیت برنامه
========================= */

let activeCategory = "همه";

let cart = [];

let scanner = null;


/* =========================
   قیمت
========================= */

function formatPrice(price) {

return price.toLocaleString("fa-IR") + " تومان";

}


/* =========================
   دسته‌بندی‌ها
========================= */

function renderCategories() {

const categories = [
"همه",
...new Set(products.map(product => product.category))
];

document.getElementById("categories").innerHTML =
categories.map(category => `

<button
class="category ${category === activeCategory ? "active" : ""}"
onclick="selectCategory('${category}')"
>

${category}

</button>

`).join("");

}


function selectCategory(category) {

activeCategory = category;

renderMenu();

}


/* =========================
   نمایش منو
========================= */

function renderMenu() {

renderCategories();

const searchText =
document.getElementById("search").value
.trim()
.toLowerCase();


const filteredProducts = products.filter(product => {

const categoryMatch =
activeCategory === "همه" ||
product.category === activeCategory;

const searchMatch =
product.name.toLowerCase().includes(searchText) ||
product.description.toLowerCase().includes(searchText);

return categoryMatch && searchMatch;

});


if (filteredProducts.length === 0) {

document.getElementById("menu").innerHTML = `
<div class="empty">
محصولی پیدا نشد.
</div>
`;

return;

}


document.getElementById("menu").innerHTML =
filteredProducts.map(product => `

<article class="product">

<div class="product-image">
${product.icon}
</div>

<div class="product-info">

<div class="product-name">
${product.name}
</div>

<div class="product-description">
${product.description}
</div>

<div class="product-bottom">

<span class="price">
${formatPrice(product.price)}
</span>

<button
class="add-button"
onclick="addToCart(${product.id})"
>
افزودن
</button>

</div>

</div>

</article>

`).join("");

updateCart();

}


/* =========================
   سبد خرید
========================= */

function addToCart(id) {

const item = cart.find(item => item.id === id);

if (item) {

item.quantity++;

} else {

cart.push({
id: id,
quantity: 1
});

}

updateCart();

}


function removeFromCart(id) {

const item = cart.find(item => item.id === id);

if (!item) return;

item.quantity--;

if (item.quantity <= 0) {

cart = cart.filter(item => item.id !== id);

}

updateCart();

}


function updateCart() {

const cartBox =
document.getElementById("cartItems");

if (cart.length === 0) {

cartBox.innerHTML = `
<div class="empty">
هنوز محصولی انتخاب نشده است.
</div>
`;

document.getElementById("cartButton")
.classList.remove("show");

document.getElementById("total")
.innerHTML = "";

return;

}


let total = 0;

let count = 0;


cartBox.innerHTML = cart.map(item => {

const product =
products.find(product => product.id === item.id);

const itemTotal =
product.price * item.quantity;

total += itemTotal;

count += item.quantity;


return `

<div class="order-row">

<span>
${product.name}
×
${item.quantity}
</span>

<span>

${formatPrice(itemTotal)}

<button
class="remove-button"
onclick="removeFromCart(${product.id})"
>
−
</button>

</span>

</div>

`;

}).join("");


document.getElementById("total").innerHTML = `

<div style="padding-top:15px;font-weight:bold">

مبلغ کل:
${formatPrice(total)}

</div>

`;


document.getElementById("cartCount")
.textContent = count;


document.getElementById("cartButton")
.classList.add("show");

}


/* =========================
   رفتن به سفارش
========================= */

function scrollToOrder() {

document.querySelector(".order")
.scrollIntoView({
behavior: "smooth"
});

}


/* =========================
   ثبت سفارش
========================= */

function submitOrder() {

if (cart.length === 0) {

alert("لطفاً ابتدا یک محصول انتخاب کنید.");

return;

}


const table =
new URLSearchParams(location.search)
.get("table") || "نامشخص";


let message =
"سفارش شما آماده ثبت است.\n\n";

message +=
"شماره میز: " + table + "\n\n";


cart.forEach(item => {

const product =
products.find(product => product.id === item.id);

message +=
product.name +
" × " +
item.quantity +
"\n";

});


message +=
"\nدر نسخه بعدی می‌توان این سفارش را مستقیماً برای آشپزخانه یا صندوق ارسال کرد.";


alert(message);

}


/* =========================
   QR Scanner
========================= */

async function openScanner() {

document
.getElementById("scannerModal")
.classList
.add("show");


if (scanner) return;


scanner =
new Html5Qrcode("reader");


try {

await scanner.start(

{
facingMode: "environment"
},

{
fps: 10,

qrbox: {
width: 230,
height: 230
}

},

decodedText => {

closeScanner();


try {

const url =
new URL(decodedText);

window.location.href =
url.href;

}

catch(error) {

alert(
"کد اسکن شد:\n" +
decodedText
);

}

},

errorMessage => {

}

);

}

catch(error) {

document.getElementById("reader").innerHTML = `

<div style="
color:white;
padding:30px;
">

دسترسی به دوربین امکان‌پذیر نیست.

<br><br>

لطفاً اجازه استفاده از دوربین را در مرورگر فعال کنید.

</div>

`;

}

}


async function closeScanner() {

document
.getElementById("scannerModal")
.classList
.remove("show");


if (scanner) {

try {

await scanner.stop();

}
catch(error) {}

try {

scanner.clear();

}
catch(error) {}

scanner = null;

document.getElementById("reader")
.innerHTML = "";

}

}


/* =========================
   تشخیص شماره میز
========================= */

const tableNumber =
new URLSearchParams(location.search)
.get("table");


if (tableNumber) {

document.getElementById("tableLabel")
.textContent =
"منوی دیجیتال • میز " +
tableNumber;

}


/* اجرای اولیه */

renderMenu();

</script>

</body>
</html>
